[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demeter"
version = "0.1.0"
description = "Expiring Mars: are Earth's Mars-analog test sites drifting away from Mars-like conditions?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6",
  "requests>=2.31",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.390"]
dev = ["pytest>=8"]

[project.scripts]
demeter = "demeter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["killtest: checks the method against the real Atacama 2015-2017 rain record (needs data/raw)"]
