# Mars-analog test sites tracked by Expiring Mars.
# Coordinates are approximate (from the team hand-off) - verify before final runs.
# Add a site: append an entry here, then `python -m demeter run`. Nothing else changes.
#
# polar: true  -> |lat| > 60. IMERG rainfall is unreliable there and MODIS has
#                 polar-night gaps, so variables can switch to a polar source.

sites:
  - id: atacama_yungay
    name: Atacama (Yungay, hyperarid core)
    country: Chile
    lat: -24.1
    lon: -70.0
    polar: false
    analog_for: Mars hyperarid soils, life detection
    events:
      - id: atacama_rains_2015_2017
        label: Rare rains, microbe die-off documented
        start: "2015-03"
        end: "2017-07"
        variable: precip
        expect_excursion_years: [2015, 2017]   # used by the kill test
        citation: Azua-Bustos et al., 2018
        url: ""   # TODO(story): paste the phys.org 2018 link from the hand-off doc

  - id: haughton_crater
    name: Haughton Crater, Devon Island
    country: Canada
