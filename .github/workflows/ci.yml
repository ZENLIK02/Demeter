name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # unit tests + contract checks + kill test on the committed data/raw
      - run: pytest -q
      # the published JSON must match contracts/ (fails if someone hand-edits docs/data)
      - run: python -m demeter export && git diff --stat -- docs/data
